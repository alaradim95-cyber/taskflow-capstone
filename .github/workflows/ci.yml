name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Reject tracked local secrets
        shell: bash
        run: |
          set -euo pipefail

          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          tracked_key_files="$(git ls-files | grep -Ei '(\.pem|\.key|\.p12|\.pfx|service[-_]?account.*\.json)$' || true)"

          if [[ -n "$tracked_env_files" || -n "$tracked_key_files" ]]; then
            echo "Potential secret-bearing files are tracked:"
            printf '%s\n%s\n' "$tracked_env_files" "$tracked_key_files"
            exit 1
          fi

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: taskflow_test
          POSTGRES_PASSWORD: taskflow-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow_test -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://localhost:5432/taskflow_test
      DB_USERNAME: taskflow_test
      DB_PASSWORD: taskflow-ci-only
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        run: mvn -B -ntp clean verify

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Test frontend
        run: npm run test --if-present

      - name: Build frontend
        run: npm run build

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs:
      - repository-hygiene
      - backend
      - frontend
    env:
      POSTGRES_DB: taskflow_ci
      POSTGRES_USER: taskflow_ci
      POSTGRES_PASSWORD: taskflow-ci-only
      BACKEND_PORT: "8080"
      FRONTEND_PORT: "3000"
      SPRING_PROFILES_ACTIVE: docker
      TASKFLOW_IMAGE_TAG: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build containers
        run: docker compose build

      - name: Scan backend image for actionable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: taskflow-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Scan frontend image for actionable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: taskflow-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Start healthy stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke-test HTTP endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health
          curl --fail --silent --show-error http://127.0.0.1:3000/health

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
